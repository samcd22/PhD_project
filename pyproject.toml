[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayespace"
version = "0.2.0"
description = "Bayesian regression and Gaussian-process inference for spatial environmental models, on NumPyro and JAX"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Samuel Davis" }]
keywords = ["bayesian", "numpyro", "gaussian plume", "spatial statistics", "gaussian process"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "jax>=0.4.30",
  "jaxlib>=0.4.30",
  "numpyro>=0.15",
  "sympy>=1.12",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "statsmodels>=0.14",
  "imageio>=2.31",
  "matplotlib-label-lines>=0.7",
  "joblib>=1.3",
  "geopy>=2.3",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
test = ["pytest>=7"]
docs = ["sphinx>=7", "sphinx-rtd-theme"]

[project.urls]
Homepage = "https://github.com/samcd22/BayeSpace"
Issues = "https://github.com/samcd22/BayeSpace/issues"

[tool.setuptools]
package-dir = { "" = "app" }

[tool.setuptools.packages.find]
where = ["app"]

[tool.setuptools.package-data]
regression_toolbox = ["models.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
